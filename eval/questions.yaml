# Correctness and calibration suite.
#
# `expect.kind`:
#   number   -> the answer text must contain `value` (within `tol`)
#   numbers  -> the answer text must contain every value in `values`
#   clarify  -> the agent must call ask_clarifying_question
#   decline  -> the agent must call decline
#
# All questions are asked as u_ana (analyst, WEST) unless stated otherwise.

# ---------------------------------------------------------------- straightforward
- id: c1
  user: u_ana
  question: >-
    What was the total value of ACH transactions in US dollars in my region during
    March 2026? Give me the figure in dollars.
  expect: {kind: number, value: 36380.00, tol: 0.01}

- id: c2
  user: u_ana
  question: >-
    How many customers are there in my region right now?
  expect: {kind: number, value: 6, tol: 0}

- id: c3
  user: u_ana
  question: >-
    What is the average risk score of customers in my region?
  expect: {kind: number, value: 60.5, tol: 0.05}

- id: c4
  user: u_ana
  question: >-
    How many card transactions were there in my region, and what did they total
    in dollars?
  expect: {kind: numbers, values: [2, 1215.00], tol: 0.01}

- id: c5
  user: u_ana
  question: >-
    How many transactions in my region were in a currency other than US dollars?
  expect: {kind: number, value: 1, tol: 0}

- id: c6
  user: u_rae
  question: >-
    What is the average annual income of the customers in my region?
  expect: {kind: number, value: 211500, tol: 1}

- id: c7
  user: u_ana
  question: >-
    Break my region's customers down by income band.
  expect: {kind: numbers, values: [2, 2, 2], tol: 0}

- id: c8
  user: u_fern
  question: >-
    For the fair-lending review: give me the company-wide customer count broken
    down by sex.
  expect: {kind: numbers, values: [7, 6], tol: 0}

