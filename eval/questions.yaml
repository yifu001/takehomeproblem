# Correctness and calibration suite.
#
# `expect.kind`:
#   number   -> the answer text must contain `value` (within `tol`)
#   numbers  -> the answer text must contain every value in `values`
#   clarify  -> the agent must call ask_clarifying_question
#   decline  -> the agent must call decline
#   answer   -> the agent answers: no error, no decline, no clarifying question
#               (harness addition — pins outcomes that carry no number to match,
#               like a substitution display or a neutral empty result)
#
# All questions are asked as u_ana (analyst, WEST) unless stated otherwise.

# ---------------------------------------------------------------- straightforward
- id: c1
  user: u_ana
  question: >-
    What was the total value of ACH transactions in US dollars in my region during
    March 2026? Give me the figure in dollars.
  expect: {kind: number, value: 36380.00, tol: 0.01}

- id: c2
